<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序演算法示範</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 900px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 50px;
        }

        .icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 3em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .description {
            color: #777;
            font-size: 0.95em;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 200px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .card-icon {
            font-size: 2.5em;
            display: block;
        }

        .card-text {
            position: relative;
            z-index: 1;
        }

        .card:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
        }

        .card:nth-child(2):hover {
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .card:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .card:nth-child(3):hover {
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2em;
            }

            .links {
                grid-template-columns: 1fr;
            }

            .card {
                max-width: 100%;
            }

            .icon {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🎯</div>
            <h1>排序演算法示範</h1>
            <p class="subtitle">Sorting Algorithms Visualization</p>
            <p class="description">快速學習和理解各種排序演算法的工作原理</p>
        </div>

        <div class="links">
            <a href="bubble sort.html" class="card">
                <span class="card-icon">🫧</span>
                <span class="card-text">氣泡排序</span>
            </a>
            <a href="insertion_sort.html" class="card">
                <span class="card-icon">📥</span>
                <span class="card-text">插入排序</span>
            </a>
            <a href="selection_sort.html" class="card">
                <span class="card-icon">✅</span>
                <span class="card-text">選擇排序</span>
            </a>
            <a href="merge_sort.html" class="card">
                <span class="card-icon">🔀</span>
                <span class="card-text">合併排序</span>
            </a>
        </div>
    </div>
</body>
</html>
